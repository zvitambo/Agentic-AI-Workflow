[project]
name = "agentic ai workflow"
version = "0.1.0"
description = "Agentic AI Workflow"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "langchain>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langchain-tavily>=0.2,<1.0",
    "langchain-google-genai>=4.4,<5.0",
    "google-genai>=2.20,<3.0",
    "python-dotenv>=1.0,<2.0",
   
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "aiohttp>=3.10,<4.0",
    "certifi>=2024.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
